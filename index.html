<!DOCTYPE html>
<html>
<head>
<title>Profile Search</title>

<style>
body{
    background: linear-gradient(to right, #dfe9f3, #ffffff);
    font-family: Arial;
    text-align: center;
    margin-top: 120px;
}

input{
    width: 350px;
    padding: 12px;
    font-size: 18px;
    border-radius: 25px;
    border: 1px solid #ccc;
    outline: none;
}

/* Button */
button{
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    background: #4285f4;
    color: white;
    cursor: pointer;
}

/* Profile card */
#result{
    margin-top: 60px;
    display: center;
}

.card{
    background: white;
    width: 350px;
    margin: auto;
    padding: 20px;
    border-radius: 15px;
}

.card img{
    width:200px;          /* medium size */
    height:200px;
    border-radius:50%;    /* makes circle */
    object-fit:cover;     /* no stretching */
    border:4px solid #4285f4;  /* nice blue ring */
    margin-bottom:10px;
}
</style>

<script>
const profiles = {
    "nani": {img:"images/nani.jpg", place:"Andhra Pradesh"},
    "manchodu": {img:"images/manchodu.jpg", place:"Peddapuram"},
    "vijaya": {img:"images/vijaya.jpg", place:"Vizayanagaram"},
    "bomma": {img:"images/bomma.jpeg", place:"Guntur"},
    "babuu": {img:"images/babuu.jpg", place:"India"},
    "darling": {img:"images/darling.webp", place:"ap"},
    "bhaai": {img:"images/bhaai.jpg", place:"hyd"},
    "rc": {img:"images/rc.jpg", place:"megahouse"},
    "pk": {img:"images/pk.jpg", place:"anywhere"},
    "ntr": {img:"images/ntr.jpg", place:". "},
};

function searchProfile(){
    let value=document.getElementById("search").value.toLowerCase();
    let result=document.getElementById("result");

    if(profiles[value]){
        document.getElementById("pimg").src = profiles[value].img;
        document.getElementById("pname").innerText = value;
        document.getElementById("pplace").innerText = profiles[value].place;
        result.style.display="block";
    }
    else{
        result.style.display="none";
        alert("No results found");
    }
}
</script>

</head>
<body>

<h1>Check Profile</h1>

<input type="text" id="search" placeholder="Search here...">
<button onclick="searchProfile()">Search</button>
<div id="result">
    <div class="card">
        <img id="pimg" src="">
        <h2 id="pname"></h2>
        <p id="pplace"></p>
    </div>
</div>
</body>
</html>
